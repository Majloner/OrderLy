name: Publish AI Toolkit

on:
  push:
    branches: [main]
    paths:
      - "tools/ai-toolkit/**"
      - ".github/workflows/publish-ai-toolkit.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/ai-toolkit/**"
      - ".github/workflows/publish-ai-toolkit.yml"

concurrency:
  group: publish-ai-toolkit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: tools/ai-toolkit

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@majloner"

      # Paczka nie ma zależności — instalacja jest zbędna (i nie ma lockfile-trapu).
      - name: Validate package.json contract
        run: |
          node -e '
            const p = require("./package.json");
            for (const f of ["name", "version"]) {
              if (!p[f]) throw new Error("package.json missing " + f);
            }
            if (p.publishConfig?.registry !== "https://npm.pkg.github.com") {
              throw new Error("publishConfig.registry must point at GitHub Packages");
            }
            console.log("package.json OK:", p.name + "@" + p.version);
          '

      - name: Validate skill frontmatter
        run: |
          test -f skills/code-review/SKILL.md
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("skills/code-review/SKILL.md", "utf8");
            const fm = raw.match(/^---\n([\s\S]*?)\n---/);
            if (!fm) throw new Error("SKILL.md has no YAML frontmatter");
            const name = (fm[1].match(/^name:\s*(.+)$/m) || [])[1];
            const desc = (fm[1].match(/^description:\s*(.+)$/m) || [])[1];
            if (name !== "code-review") throw new Error("frontmatter name must equal the skill directory name, got: " + name);
            if (!desc) throw new Error("frontmatter description is required");
            console.log("SKILL.md frontmatter OK");
          '

      - name: Installer unit tests
        run: npm test

      - name: Pack dry run
        run: npm pack --dry-run

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@majloner"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
