name: AI Code Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-review:
    runs-on: ubuntu-latest
    env:
      # Uwierzytelnianie subskrypcją (Pro/Max): lokalnie `claude setup-token`,
      # wynik wklej jako sekret repo CLAUDE_CODE_OAUTH_TOKEN. Review na CI zużywa
      # limity planu; token rotuj po wygaśnięciu.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # promptfoo eval (tools/code-review-agent/eval, 2026-09-08): sonnet 3/3 na zestawie
      # regresyjnym przy ~45% kosztu opusa — wystarcza jako model bramki CI.
      REVIEW_MODEL: claude-sonnet-5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install review agent
        working-directory: tools/code-review-agent
        run: npm ci --omit=dev

      - name: Build PR diff
        working-directory: tools/code-review-agent
        run: git diff origin/${{ github.base_ref }}...HEAD -- ':(exclude)package-lock.json' > pr.diff

      - name: Run review agent
        id: review
        working-directory: tools/code-review-agent
        run: |
          set +e
          node src/review.mjs pr.diff > review.md 2> errors.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat review.md
          cat errors.log >&2

      - name: Comment on PR
        if: always() && steps.review.outputs.exit_code != '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "tools/code-review-agent/review.md";
            const exitCode = "${{ steps.review.outputs.exit_code }}";
            let body;
            if (fs.existsSync(path) && fs.readFileSync(path, "utf8").trim()) {
              const verdict = exitCode === "0" ? "✅ APPROVE" : exitCode === "3" ? "❌ REQUEST CHANGES" : "⚠️ REVIEW ERROR";
              body = `## 🤖 AI Code Review — ${verdict}\n\n${fs.readFileSync(path, "utf8")}`;
            } else {
              body = "## 🤖 AI Code Review\n\nThe review agent failed before producing a verdict — check the job logs.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Gate on verdict
        run: |
          code="${{ steps.review.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo "Review approved."
          elif [ "$code" = "3" ]; then
            echo "::error::AI review requested changes — see the PR comment."
            exit 1
          else
            echo "::error::Review agent failed (exit $code) — see job logs."
            exit 1
          fi
